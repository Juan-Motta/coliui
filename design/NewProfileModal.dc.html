<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColiUI — New profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1D1D1F}
a{color:#0066CC}a:hover{color:#004C99}
.glass{background:rgba(255,255,255,0.6);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 4px 16px rgba(0,0,0,0.08)}
.in{height:30px;box-sizing:border-box;border:0;border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;background:rgba(0,0,0,0.05);color:#1D1D1F;min-width:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#3A3A3C}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.hint{font-size:11px;color:#6E6E73}
.err{font-size:11px;color:#B42318}
.pill{box-sizing:border-box;height:32px;padding:0 16px;border:0;border-radius:16px;background:rgba(0,0,0,0.06);font-size:13px;font-family:inherit;color:#1D1D1F;cursor:pointer}
.tint{box-sizing:border-box;height:32px;padding:0 20px;border-radius:16px;background:#0A6FD6;color:#FFFFFF;border:1px solid rgba(255,255,255,0.4);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 4px 14px rgba(0,102,204,0.3);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.tint:disabled{opacity:0.45;cursor:default}
.seg{height:26px;padding:0 12px;border:0;border-radius:13px;background:transparent;font-size:12px;font-family:inherit;color:#3A3A3C;cursor:pointer}
.on{background:#FFFFFF;color:#1D1D1F;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.14)}
.step{width:26px;height:26px;border:0;border-radius:13px;background:rgba(0,0,0,0.06);font-size:15px;cursor:pointer}
</style>
</helmet>
<div style="width: 960px; height: 760px; box-sizing: border-box; padding: 24px; background: linear-gradient(135deg, #BFD3EE 0%, #E6D7EC 50%, #CFE6DA 100%)">
<div style="position: relative; height: 100%; background: #FBFBFD; border: 1px solid rgba(0,0,0,0.12); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.22)">
<div inert="" aria-hidden="true" style="display: flex; height: 100%">
<div style="flex: 0 0 200px; background: #FFFFFF; border-right: 1px solid rgba(0,0,0,0.08)"></div>
<div style="flex: 1; display: flex; flex-direction: column; padding: 14px 16px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Colima profiles</span><span style="font-size: 11px; color: #6E6E73">1 of 2 running</span></div>
<span style="height: 34px; width: 130px; border-radius: 17px; background: #0A6FD6"></span>
</div>
<div style="flex: 1; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08)"></div>
</div>
</div>
<!-- Clicking the dimmed area closes the modal, like Settings. -->
<div aria-hidden="true" title="Click outside to close" style="position: absolute; inset: 0; background: rgba(240,240,244,0.55)"></div>
<div role="dialog" aria-labelledby="h" class="glass" style="position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 520px; box-sizing: border-box; background: rgba(252,252,254,0.88); border-radius: 26px; box-shadow: 0 30px 70px rgba(0,0,0,0.28); padding: 24px 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 3px">
<h2 id="h" style="margin: 0; font-size: 17px; font-weight: 600">New profile</h2>
<span style="font-size: 12px; color: #6E6E73">Creates and starts a new Colima VM</span>
</div>
<label class="lbl">Name
<input class="in mono" value="work"><span class="hint">Lowercase letters, digits and “-”</span></label>
<div class="row">CPUs<span style="display: flex; align-items: center; gap: 8px"><button class="step" aria-label="Fewer CPUs">−</button><b style="width: 28px; text-align: center">4</b><button class="step" aria-label="More CPUs">+</button></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div class="row">Memory<b>8 GiB</b></div><input type="range" min="1" max="32" value="8" style="accent-color: #0066CC"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div class="row">Disk<b>60 GiB</b></div><input type="range" min="20" max="500" value="60" style="accent-color: #0066CC"><span class="hint">Disk can grow but never shrink</span></div>
<div class="row">VM type<div role="group" aria-label="VM type" style="display: inline-flex; padding: 2px; background: rgba(0,0,0,0.05); border-radius: 15px"><button class="seg on" aria-pressed="true">vz</button><button class="seg">qemu</button></div></div>
<div class="row">Mount type<select class="in" style="width: 120px"><option>virtiofs</option><option>sshfs</option><option>9p</option></select></div>
<div class="row">Rosetta (x86 emulation)<input type="checkbox" role="switch" checked style="width: 16px; height: 16px; accent-color: #30A14E"></div>
<div class="row">Runtime<select class="in" style="width: 120px"><option>docker</option><option>containerd</option><option>incus</option></select></div>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button class="pill">Cancel</button>
<button class="tint">Create and start</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
