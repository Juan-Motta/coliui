<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColiUI — Menu bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1D1D1F}
a{color:#0066CC}a:hover{color:#004C99}
.glass{background:rgba(255,255,255,0.6);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 4px 16px rgba(0,0,0,0.08)}
.mi:hover{background:rgba(0,0,0,0.05)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;border-radius:15px;background:transparent;color:#1D1D1F;cursor:pointer;padding:0}
.ib:hover{background:rgba(0,0,0,0.07)}
.round{width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,0.06)}
.pill{flex:1;box-sizing:border-box;height:32px;border:0;border-radius:16px;background:rgba(0,0,0,0.06);font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:#1D1D1F}
.pill:hover{background:rgba(0,0,0,0.1)}
.cap{font-size:11px;font-weight:600;color:#5E5E63;letter-spacing:0.04em}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,0.7);border-radius:14px;padding:9px 10px;min-height:66px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px}
.num{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
</style>
</helmet>
<div style="width: 360px; height: 720px; box-sizing: border-box; padding: 12px; background: linear-gradient(135deg, #BFD3EE 0%, #E6D7EC 50%, #CFE6DA 100%)">
<div class="glass" style="position: relative; height: 100%; box-sizing: border-box; background: rgba(250,250,252,0.72); border-radius: 22px; box-shadow: 0 18px 44px rgba(0,0,0,0.2); padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 0">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 100 100" fill="none" style="color: #1D1D1F"><rect x="8" y="8" width="84" height="84" rx="18" stroke="currentColor" stroke-width="8"></rect><g transform="translate(12 12) scale(0.78)"><path d="M30 95 L32 44 C32 36 34 32 37 30 L35 16 L41 27 L44 14 L47 28 C52 29 60 32 66 36 C69 38 69 44 66 46 C62 48 57 49 53 50 C51 54 50 60 50 70 L52 95 Z" fill="currentColor"></path></g></svg>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 600">ColiUI</span>
<span style="font-size: 11px; color: #5E5E63">Profile: default</span>
</div>
<button class="ib round" aria-label="Quit ColiUI" title="Quit ColiUI (⌘Q)" onClick="{{askQuit}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 4px; padding: 0 2px">
<button class="ib" aria-label="Restart Colima" title="Restart Colima" onClick="{{askRestart}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<button class="ib" aria-label="Stop Colima" title="Stop Colima" onClick="{{askStop}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>
<span style="flex: 1"></span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #1E7F3C; background: rgba(40,200,64,0.14); padding: 4px 10px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #28C840"></span>Running</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cards}}" as="r" hint-placeholder-count="2">
<div class="card">
<svg aria-hidden="true" viewBox="0 0 100 40" preserveAspectRatio="none" style="position: absolute; left: 6px; bottom: 4px; width: calc(100% - 12px); height: 36px">
<path d="{{r.area}}" fill="{{r.fill}}"></path>
<path d="{{r.line}}" fill="none" stroke="{{r.stroke}}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<div style="display: flex; justify-content: space-between; position: relative"><span class="cap">{{r.title}}</span><span style="font-size: 11px; color: #5E5E63; font-variant-numeric: tabular-nums">{{r.size}}</span></div>
<span class="num">{{r.value}}</span>
</div>
</sc-for>
</div>

<div style="background: rgba(255,255,255,0.7); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><span class="cap">DISK</span><span style="font-size: 11px; color: #5E5E63; font-variant-numeric: tabular-nums">21.0 GiB / 97.9 GiB</span></div>
<div aria-hidden="true" style="height: 6px; border-radius: 3px; background: rgba(0,0,0,0.08); overflow: hidden"><div style="width: 21%; height: 100%; border-radius: 3px; background: #30A14E"></div></div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 6px 0">
<span class="cap">CONTAINERS</span>
<span style="font-size: 11px; color: #5E5E63">4 of 6 running</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; flex: 1; align-self: stretch; background: rgba(255,255,255,0.7); border-radius: 14px; padding: 4px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div class="mi" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px; border-radius: 10px">
<button class="ib" aria-label="{{g.toggleLabel}}" aria-expanded="{{g.expanded}}" onClick="{{g.toggle}}" style="width: 20px; height: 20px"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5E5E63" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="{{g.chevron}}"><path d="M9 6l6 6-6 6"></path></svg></button>
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{g.iconColor}}" stroke-width="2" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg>
<span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
<span style="font-size: 11px; font-weight: 600; color: {{g.badgeColor}}; background: {{g.badgeBg}}; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums">{{g.summary}}</span>
<sc-if value="{{g.canStop}}" hint-placeholder-val="{{true}}">
<button class="ib" aria-label="{{g.restartLabel}}" title="{{g.restartLabel}}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<button class="ib" aria-label="{{g.stopLabel}}" title="{{g.stopLabel}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>
</sc-if>
<sc-if value="{{g.canStart}}" hint-placeholder-val="{{false}}">
<button class="ib" aria-label="{{g.startLabel}}" title="{{g.startLabel}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="#1E7F3C"><path d="M8 5v14l11-7z"></path></svg></button>
</sc-if>
</div>
<sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
<sc-for list="{{g.items}}" as="c" hint-placeholder-count="3">
<div class="mi" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 4px 0 34px; border-radius: 10px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 13px; font-weight: 500">{{c.name}}</span>
<span style="font-size: 11px; color: #5E5E63">{{c.meta}}</span>
</div>
<sc-if value="{{c.running}}" hint-placeholder-val="{{true}}">
<button class="ib" aria-label="Restart container" title="Restart"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<button class="ib" aria-label="Stop container" title="Stop"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
</sc-if>
<sc-if value="{{c.stopped}}" hint-placeholder-val="{{false}}">
<button class="ib" aria-label="Start container"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#1E7F3C"><path d="M8 5v14l11-7z"></path></svg></button>
</sc-if>
</div>
</sc-for>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" class="pill" style="text-decoration: none; font-weight: 500; color: #1D1D1F">Open ColiUI</a>
<a href="Settings.dc.html" class="ib" aria-label="Settings" style="background: rgba(0,0,0,0.06); width: 32px; height: 32px; border-radius: 16px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a>
</div>

<sc-if value="{{confirming}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(240,240,244,0.6); display: flex; align-items: center; justify-content: center; padding: 20px">
<div role="alertdialog" aria-labelledby="ch" class="glass" style="width: 100%; max-width: 260px; box-sizing: border-box; background: rgba(252,252,254,0.92); border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,0.22); padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: center">
<h2 id="ch" style="margin: 0; font-size: 14px; font-weight: 600">{{dlg.title}}</h2>
<p style="margin: 0; font-size: 12px; color: #5E5E63; line-height: 1.45">{{dlg.message}}</p>
<div style="display: flex; gap: 8px; margin-top: 6px">
<button class="pill" onClick="{{cancel}}">Cancel</button>
<button class="pill" style="background: {{dlg.confirmBg}}; color: #FFFFFF; font-weight: 600" onClick="{{cancel}}">{{dlg.confirm}}</button>
</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ask: null, closed: {} };
  }
  renderVals() {
    const dotOf = (st) => st === 'running' ? '#28C840' : st === 'exited' ? '#E8590C' : '#AEAEB2';
    const data = [
      { id: 'shop', name: 'shop-backend', compose: true, members: [
        ['api', 'running', 'Up 12 min · 8080'], ['db', 'running', 'Up 3 hours · 5432'],
        ['cache', 'running', 'Up 3 hours'], ['worker', 'exited', 'Exited (1)']
      ] },
      { id: 'none', name: 'Standalone', compose: false, members: [
        ['nginx-proxy', 'running', 'Up 2 days · 80, 443'], ['mailpit', 'stopped', 'Exited (0)']
      ] }
    ];
    const closed = this.state.closed || {};
    const groups = data.map((g) => {
      const up = g.members.filter((m) => m[1] === 'running').length;
      const total = g.members.length;
      const open = !closed[g.id];
      const partial = up > 0 && up < total;
      return {
        name: g.name, open,
        expanded: open ? 'true' : 'false',
        toggleLabel: (open ? 'Collapse ' : 'Expand ') + g.name,
        chevron: open ? 'transform: rotate(90deg)' : '',
        toggle: () => this.setState({ closed: { ...closed, [g.id]: open } }),
        icon: g.compose ? 'M3 7h7l2 2h9v10H3z' : 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9',
        iconColor: g.compose ? '#0066CC' : '#5E5E63',
        summary: up + ' / ' + total,
        badgeColor: up === 0 ? '#6E6E73' : partial ? '#B54708' : '#1E7F3C',
        badgeBg: up === 0 ? 'rgba(0,0,0,0.05)' : partial ? '#FEF3E7' : '#E7F6EC',
        canStop: g.compose && up > 0, canStart: g.compose && up === 0,
        stopLabel: 'Stop all in ' + g.name, startLabel: 'Start all in ' + g.name, restartLabel: 'Restart all in ' + g.name,
        items: g.members.map(([name, state, meta]) => ({ name, meta, running: state === 'running', stopped: state !== 'running', dot: dotOf(state) }))
      };
    });
    // Last 24 samples (every 3 s) drawn as an area under a line, tinted green → red by the current level.
    const spark = (values) => {
      const pts = values.map((v, i) => [i * 100 / (values.length - 1), 40 - v * 40]);
      const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      return { line, area: line + ' L100 40 L0 40 Z' };
    };
    const tint = (level) => level < 0.6 ? ['#30A14E', 'rgba(48,161,78,0.18)'] : level < 0.85 ? ['#C77C0A', 'rgba(199,124,10,0.18)'] : ['#C4320A', 'rgba(196,50,10,0.18)'];
    const cpu = [0.08, 0.1, 0.07, 0.12, 0.18, 0.11, 0.09, 0.14, 0.22, 0.16, 0.12, 0.1, 0.13, 0.19, 0.12, 0.1, 0.08, 0.11, 0.15, 0.12, 0.09, 0.1, 0.14, 0.12];
    const ram = [0.48, 0.49, 0.5, 0.5, 0.51, 0.52, 0.52, 0.51, 0.53, 0.54, 0.55, 0.54, 0.53, 0.53, 0.54, 0.55, 0.55, 0.54, 0.53, 0.52, 0.52, 0.53, 0.52, 0.52];
    const cards = [
      { title: 'CPU', size: '4 cores', value: '12%', ...spark(cpu), stroke: tint(0.12)[0], fill: tint(0.12)[1] },
      { title: 'RAM', size: '4 GiB', value: '2.1 GiB', ...spark(ram), stroke: tint(0.52)[0], fill: tint(0.52)[1] }
    ];
    const asks = {
      restart: { title: 'Restart Colima?', message: 'This will restart the Colima VM.', confirm: 'Restart', confirmBg: '#0A6FD6' },
      stop: { title: 'Stop Colima?', message: 'Containers and services running in Colima will stop.', confirm: 'Stop', confirmBg: '#C4320A' },
      quit: { title: 'Quit ColiUI?', message: 'ColiUI will close. Your containers will keep running.', confirm: 'Quit', confirmBg: '#0A6FD6' }
    };
    const ask = this.state.ask;
    return {
      groups, cards,
      confirming: ask !== null, dlg: asks[ask] || asks.stop,
      askRestart: () => this.setState({ ask: 'restart' }),
      askStop: () => this.setState({ ask: 'stop' }),
      askQuit: () => this.setState({ ask: 'quit' }),
      cancel: () => this.setState({ ask: null })
    };
  }
}
</script>
</body>
</html>
