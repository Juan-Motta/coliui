<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColiUI — Container environment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1D1D1F}
a{color:#0066CC}a:hover{color:#004C99}
.glass{background:rgba(255,255,255,0.6);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 4px 16px rgba(0,0,0,0.08)}
.cap{box-sizing:border-box;height:34px;border-radius:17px;display:inline-flex;align-items:center;gap:2px;padding:0 3px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:28px;border:0;border-radius:14px;background:transparent;color:#1D1D1F;cursor:pointer;padding:0;text-decoration:none}
.ib:hover{background:rgba(0,0,0,0.06);color:#1D1D1F}
.seg{height:28px;padding:0 12px;border:0;border-radius:14px;background:transparent;font-size:12px;font-family:inherit;color:#3A3A3C;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.seg:hover{color:#1D1D1F}
.on{background:#FFFFFF;color:#1D1D1F;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.14)}
.nav:hover{background:rgba(0,0,0,0.05)}
.card{background:#FFFFFF;border:1px solid rgba(0,0,0,0.08);border-radius:14px}
.pill{box-sizing:border-box;height:30px;padding:0 12px;border:0;border-radius:15px;background:rgba(0,0,0,0.05);font-size:12px;font-family:inherit;color:#1D1D1F;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill:hover{background:rgba(0,0,0,0.09)}
.pill-on{background:rgba(0,102,204,0.14);color:#0B4F8A}
.pill-on:hover{background:rgba(0,102,204,0.2)}
.row:hover{background:rgba(0,102,204,0.05)}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:11px}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 24px; background: linear-gradient(135deg, #BFD3EE 0%, #E6D7EC 50%, #CFE6DA 100%); display: flex; justify-content: center">
<div style="width: 100%; max-width: 1232px; min-height: 752px; display: flex; flex-wrap: wrap; background: #FBFBFD; border: 1px solid rgba(0,0,0,0.12); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.22)">

<div style="flex: 0 0 240px; background: #FFFFFF; border-right: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column">
<dc-import name="Sidebar" selected="Containers" hint-size="240px,752px"></dc-import>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 60px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; box-sizing: border-box; flex-wrap: wrap">
<div class="glass cap"><a class="ib" href="Main.dc.html" aria-label="Back to containers" style="width: 28px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a></div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">api-server</span>
<span style="font-size: 11px; color: #6E6E73; font-family: ui-monospace, Menlo, monospace">e81b3f0c55d2 · myapp/api:latest</span>
</div>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #1E7F3C; background: #E7F6EC; padding: 4px 10px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #28C840"></span>Up 12 min</span>
<div style="flex: 1"></div>
<div class="glass cap">
<button class="ib" aria-label="Stop"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>
<button class="ib" aria-label="Restart"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<a class="ib" href="Terminal.dc.html" aria-label="Open shell"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 17l6-5-6-5M12 19h8"></path></svg></a>
</div>
<div class="glass cap">
<button class="ib" aria-label="Remove container"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</header>

<div style="padding: 0 16px">
<nav aria-label="Container views" class="glass cap">
<a class="seg" href="Detail.dc.html">Logs</a>
<a class="seg" href="LiveStats.dc.html">Stats</a>
<a class="seg" href="Terminal.dc.html">Terminal</a>
<a class="seg" href="Inspect.dc.html">Inspect</a>
<a class="seg on" href="Environment.dc.html" aria-current="page">Environment</a>
</nav>
</div>

<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<label class="cap" style="flex: 1; min-width: 180px; padding: 0 12px; gap: 6px; background: rgba(0,0,0,0.05)">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; left: -9999px">Filter variables</span>
<input type="search" placeholder="Filter variables" style="border: 0; background: transparent; outline: none; font-size: 13px; width: 100%; font-family: inherit">
</label>
<div role="group" aria-label="Variable source" class="cap" style="background: rgba(0,0,0,0.05)">
<sc-for list="{{segments}}" as="s" hint-placeholder-count="3">
<button class="{{s.cls}}" aria-pressed="{{s.active}}" onClick="{{s.pick}}">{{s.label}}</button>
</sc-for>
</div>
<button class="{{revealCls}}" aria-pressed="{{revealPressed}}" onClick="{{toggleReveal}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{revealLabel}}</button>
<button class="pill"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>Copy as .env</button>
</div>

<div class="card" style="flex: 1; min-height: 540px; overflow: auto">
<div style="min-width: 680px">
<div style="display: grid; grid-template-columns: 1.3fr 2.6fr 96px 64px; gap: 12px; padding: 10px 16px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 11px; font-weight: 600; color: #6E6E73; letter-spacing: 0.03em">
<span>NAME</span><span>VALUE</span><span>SOURCE</span><span style="text-align: center">COPY</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div class="row" style="display: grid; grid-template-columns: 1.3fr 2.6fr 96px 64px; gap: 12px; align-items: center; padding: 0 16px; height: 40px; border-bottom: 1px solid rgba(0,0,0,0.04)">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; min-width: 0">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: {{r.valueColor}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.shown}}</span>
<sc-if value="{{r.secret}}" hint-placeholder-val="{{false}}">
<button class="ib" aria-label="{{r.eyeLabel}}" onClick="{{r.toggle}}" style="width: 26px; height: 22px; flex: none; color: #6E6E73"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</sc-if>
</span>
<span><span class="chip" style="background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.source}}</span></span>
<div style="display: flex; justify-content: center">
<button class="ib" aria-label="{{r.copyLabel}}" style="width: 28px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h9"></path></svg></button>
</div>
</div>
</sc-for>
</div>
</div>

<p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6E6E73"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>{{maskedNote}} · read-only: changing a variable means recreating the container</p>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { source: 'all', revealAll: false, revealed: {} }; }
  renderVals() {
    const { source, revealAll, revealed } = this.state;
    const vars = [
      ['NODE_ENV', 'production', 'container'],
      ['PORT', '8080', 'container'],
      ['DATABASE_URL', 'postgres://app:s3cr3t@db:5432/shop', 'container', true],
      ['REDIS_URL', 'redis://redis-cache:6379', 'container'],
      ['JWT_SECRET', 'f4a91c0e7b2d58', 'container', true],
      ['STRIPE_API_KEY', 'sk_test_51Hx…', 'container', true],
      ['LOG_LEVEL', 'info', 'container'],
      ['PATH', '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', 'image'],
      ['NODE_VERSION', '22.11.0', 'image'],
      ['YARN_VERSION', '1.22.22', 'image'],
      ['HOSTNAME', 'e81b3f0c55d2', 'image'],
      ['HOME', '/root', 'image']
    ].map(([name, value, src, secret]) => ({ name, value, src, secret: !!secret }));
    const counts = { all: vars.length, container: vars.filter((v) => v.src === 'container').length, image: vars.filter((v) => v.src === 'image').length };
    const segments = [['all', 'All'], ['container', 'Container'], ['image', 'Image']].map(([id, label]) => ({
      label: label + ' (' + counts[id] + ')',
      active: source === id ? 'true' : 'false',
      cls: source === id ? 'seg on' : 'seg',
      pick: () => this.setState({ source: id })
    }));
    const rows = vars.filter((v) => source === 'all' || v.src === source).map((v) => {
      const visible = !v.secret || revealAll || revealed[v.name];
      return {
        name: v.name,
        shown: visible ? v.value : '••••••',
        valueColor: visible ? '#3A3A3C' : '#8E8E93',
        secret: v.secret,
        eyeLabel: (visible ? 'Hide ' : 'Show ') + v.name,
        toggle: () => this.setState({ revealed: { ...this.state.revealed, [v.name]: !this.state.revealed[v.name] } }),
        source: v.src === 'container' ? 'Container' : 'Image',
        chipBg: v.src === 'container' ? 'rgba(0,102,204,0.10)' : 'rgba(0,0,0,0.06)',
        chipFg: v.src === 'container' ? '#0B4F8A' : '#3A3A3C',
        copyLabel: 'Copy ' + v.name
      };
    });
    const secrets = vars.filter((v) => v.secret).length;
    return {
      segments, rows,
      revealCls: revealAll ? 'pill pill-on' : 'pill',
      revealPressed: revealAll ? 'true' : 'false',
      revealLabel: revealAll ? 'Hide secrets' : 'Show secrets',
      toggleReveal: () => this.setState({ revealAll: !this.state.revealAll, revealed: {} }),
      maskedNote: revealAll ? 'Secrets visible until you leave this tab' : secrets + ' secrets masked'
    };
  }
}
</script>
</body>
</html>
