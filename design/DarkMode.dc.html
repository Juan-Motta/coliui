<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColiUI — Dark mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#F5F5F7}
a{color:#4DA3FF}a:hover{color:#7BBBFF}
.glass{background:rgba(44,44,48,0.6);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.12);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),0 4px 16px rgba(0,0,0,0.3)}
.cap{box-sizing:border-box;height:34px;border-radius:17px;display:inline-flex;align-items:center;gap:2px;padding:0 3px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:28px;border:0;border-radius:14px;background:transparent;color:#F5F5F7;cursor:pointer;padding:0}
.ib:hover{background:rgba(255,255,255,0.1)}
.seg{height:28px;padding:0 12px;border:0;border-radius:14px;background:transparent;font-size:12px;font-family:inherit;color:#D1D1D6;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.on{background:#636366;color:#FFFFFF;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.3)}
.tint{background:#0A84FF;color:#FFFFFF;border:1px solid rgba(255,255,255,0.25);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 4px 14px rgba(10,132,255,0.35)}
.tint:hover{color:#FFFFFF;background:#0077ED}
.nav:hover{background:rgba(255,255,255,0.08)}
.card{background:#232326;border:1px solid rgba(255,255,255,0.08);border-radius:14px}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 24px; background: linear-gradient(135deg, #1B2440 0%, #2A1E36 50%, #16302A 100%); display: flex; justify-content: center">
<div style="width: 100%; max-width: 1232px; min-height: 752px; display: flex; flex-wrap: wrap; background: #1C1C1E; border: 1px solid rgba(255,255,255,0.14); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.5)">

<div style="flex: 0 0 240px; background: #232326; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column">
<dc-import name="Sidebar" selected="Containers" dark="{{isDark}}" hint-size="240px,752px"></dc-import>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 60px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; box-sizing: border-box; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; margin-right: 6px">
<span style="font-size: 15px; font-weight: 600">Containers</span>
<span style="font-size: 11px; color: #AEAEB2">4 running · 2 stopped</span>
</div>
<div role="group" aria-label="View" class="glass cap">
<button class="seg on" aria-pressed="true">List</button>
<a class="seg" href="Compose.dc.html">Compose groups</a>
</div>
<div style="flex: 1"></div>
<div class="glass cap">
<button class="ib" aria-label="Refresh"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<button class="ib" aria-label="Sort"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></button>
</div>
<label class="glass cap" style="width: 200px; padding: 0 12px; gap: 6px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; left: -9999px">Search containers</span>
<input type="search" placeholder="Search" style="border: 0; background: transparent; outline: none; font-size: 13px; width: 100%; font-family: inherit; color: #F5F5F7">
</label>
<a href="RunContainer.dc.html" class="cap tint" style="padding: 0 14px; gap: 6px; font-size: 13px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Run container</a>
</header>

<main style="flex: 1; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div class="card" style="overflow-x: auto">
<div style="min-width: 720px">
<div style="display: grid; grid-template-columns: 2fr 2fr 1.4fr 1.4fr 0.8fr 1fr 96px; gap: 12px; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 11px; font-weight: 600; color: #AEAEB2; letter-spacing: 0.03em">
<span>NAME</span><span>IMAGE</span><span>STATUS</span><span>PORTS</span><span>CPU</span><span>MEMORY</span><span style="text-align: center">ACTIONS</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 2fr 2fr 1.4fr 1.4fr 0.8fr 1fr 96px; gap: 12px; align-items: center; padding: 0 16px; height: 52px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; background: {{r.bg}}">
<span style="font-weight: 500">{{r.name}}</span>
<span style="color: #D1D1D6; font-family: ui-monospace, Menlo, monospace; font-size: 12px">{{r.image}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{r.statusColor}}; font-weight: 500"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>{{r.status}}</span>
<span style="font-size: 12px; color: #4DA3FF; font-family: ui-monospace, Menlo, monospace">{{r.ports}}</span>
<span style="font-size: 12px; color: #D1D1D6">{{r.cpu}}</span>
<span style="font-size: 12px; color: #D1D1D6">{{r.mem}}</span>
<div style="display: flex; justify-content: center; gap: 2px">
<button class="ib" aria-label="Restart" style="width: 28px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<button class="ib" aria-label="Remove" style="width: 28px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF6961" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</div>
</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #AEAEB2">Follows the system appearance by default; override in Settings › General › Appearance.</p>
</main>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['postgres-dev', 'postgres:16-alpine', 'running', 'Up 3 hours', '5432→5432', '0.4%', '86 MiB'],
      ['redis-cache', 'redis:7', 'running', 'Up 3 hours', '6379→6379', '0.2%', '12 MiB'],
      ['api-server', 'myapp/api:latest', 'running', 'Up 12 min', '8080→8080', '3.1%', '214 MiB'],
      ['nginx-proxy', 'nginx:1.27', 'running', 'Up 2 days', '80→80, 443', '0.1%', '9 MiB'],
      ['worker-jobs', 'myapp/worker:latest', 'exited', 'Exited (1)', '—', '—', '—'],
      ['mailpit', 'axllent/mailpit', 'stopped', 'Exited (0)', '—', '—', '—']
    ].map(([name, image, st, status, ports, cpu, mem], i) => ({
      name, image, status, ports, cpu, mem,
      bg: i === 2 ? 'rgba(77,163,255,0.14)' : 'transparent',
      dot: st === 'running' ? '#30D158' : st === 'exited' ? '#FF9F0A' : '#8E8E93',
      statusColor: st === 'running' ? '#4CD964' : st === 'exited' ? '#FFB340' : '#AEAEB2'
    }));
    return { rows, isDark: true };
  }
}
</script>
</body>
</html>
