<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColiUI — Images</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1D1D1F}
a{color:#0066CC}a:hover{color:#004C99}
.glass{background:rgba(255,255,255,0.6);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 4px 16px rgba(0,0,0,0.08)}
.cap{box-sizing:border-box;height:34px;border-radius:17px;display:inline-flex;align-items:center;gap:2px;padding:0 3px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:28px;border:0;border-radius:14px;background:transparent;color:#1D1D1F;cursor:pointer;padding:0}
.ib:hover{background:rgba(0,0,0,0.06)}
.seg{height:28px;padding:0 12px;border:0;border-radius:14px;background:transparent;font-size:12px;font-family:inherit;color:#3A3A3C;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.on{background:#FFFFFF;color:#1D1D1F;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.14)}
.tint{background:#0A6FD6;color:#FFFFFF;border:1px solid rgba(255,255,255,0.4);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 4px 14px rgba(0,102,204,0.3);cursor:pointer;font-family:inherit}
.tint:hover{color:#FFFFFF;background:#0862BF}
.row:hover{background:rgba(0,102,204,0.05)}
.card{background:#FFFFFF;border:1px solid rgba(0,0,0,0.08);border-radius:14px}
.pill{box-sizing:border-box;height:32px;padding:0 14px;border:0;border-radius:16px;background:rgba(0,0,0,0.05);font-size:13px;font-family:inherit;color:#1D1D1F;cursor:pointer}
.pill:hover{background:rgba(0,0,0,0.08)}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 24px; background: linear-gradient(135deg, #BFD3EE 0%, #E6D7EC 50%, #CFE6DA 100%); display: flex; justify-content: center">
<div style="width: 100%; max-width: 1232px; min-height: 752px; display: flex; flex-wrap: wrap; background: #FBFBFD; border: 1px solid rgba(0,0,0,0.12); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.22)">

<div style="flex: 0 0 240px; background: #FFFFFF; border-right: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column">
<dc-import name="Sidebar" selected="Images" hint-size="240px,752px"></dc-import>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 60px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; box-sizing: border-box; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; margin-right: 6px">
<span style="font-size: 15px; font-weight: 600">Images</span>
<span style="font-size: 11px; color: #6E6E73">8 images · 2.9 GB</span>
</div>
<div style="flex: 1"></div>
<div class="glass cap">
<button class="ib" aria-label="Refresh"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
<button class="ib" aria-label="Sort"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></button>
</div>
<label class="glass cap" style="width: 200px; padding: 0 12px; gap: 6px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; left: -9999px">Search images</span>
<input type="search" placeholder="Search" style="border: 0; background: transparent; outline: none; font-size: 13px; width: 100%; font-family: inherit">
</label>
<button class="cap tint" onClick="{{togglePull}}" style="padding: 0 14px; gap: 6px; font-size: 13px; font-weight: 500">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Pull image</button>
</header>

<main style="flex: 1; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{pullOpen}}" hint-placeholder-val="{{true}}">
<form class="glass" style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 22px; flex-wrap: wrap">
<label for="pull-ref" style="font-size: 13px; font-weight: 500">Image</label>
<input id="pull-ref" type="text" value="python:3.13-slim" style="flex: 1; min-width: 220px; height: 30px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 10px; background: rgba(0,0,0,0.05); font-family: ui-monospace, Menlo, monospace; font-size: 12px; outline: none">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #3A3A3C; min-width: 180px">
<span aria-hidden="true" style="width: 120px; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.08); overflow: hidden; display: flex"><span style="width: 62%; background: #0066CC"></span></span>Downloading 62%</span>
<button type="button" class="pill" onClick="{{togglePull}}">Cancel</button>
<button type="button" class="cap tint" style="height: 32px; padding: 0 16px; font-size: 13px; font-weight: 600">Pull</button>
</form>
</sc-if>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div role="group" aria-label="Filter images" class="glass cap">
<sc-for list="{{segments}}" as="seg" hint-placeholder-count="4">
<button class="{{seg.cls}}" onClick="{{seg.pick}}" aria-pressed="{{seg.active}}">{{seg.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #6E6E73">Images in use can't be removed while a container uses them</span>
</div>

<div class="card" style="overflow-x: auto">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 2.4fr 1.2fr 1.3fr 1fr 0.9fr 1.6fr 84px; gap: 12px; padding: 10px 16px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 11px; font-weight: 600; color: #6E6E73; letter-spacing: 0.03em">
<span>REPOSITORY</span><span>TAG</span><span>IMAGE ID</span><span>CREATED</span><span style="text-align: right">SIZE</span><span>USED BY</span><span style="text-align: center">ACTIONS</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div class="row" style="display: grid; grid-template-columns: 2.4fr 1.2fr 1.3fr 1fr 0.9fr 1.6fr 84px; gap: 12px; align-items: center; padding: 0 16px; height: 48px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 13px">
<span style="font-weight: 500; color: {{r.repoColor}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.repo}}</span>
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #3A3A3C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.tag}}</span>
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #6E6E73">{{r.id}}</span>
<span style="font-size: 12px; color: #3A3A3C">{{r.created}}</span>
<span style="font-size: 12px; color: #3A3A3C; text-align: right">{{r.size}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{r.usedColor}}; overflow: hidden; white-space: nowrap"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span><span style="overflow: hidden; text-overflow: ellipsis">{{r.usedBy}}</span></span>
<div style="display: flex; justify-content: center; gap: 2px">
<button class="ib" aria-label="Run a container from this image" style="width: 28px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#1E7F3C"><path d="M8 5v14l11-7z"></path></svg></button>
<button class="ib" aria-label="Remove image" disabled="{{r.inUse}}" style="width: 28px; opacity: {{r.removeOpacity}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</div>
</sc-for>
</div>
</div>
</main>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', pullOpen: true }; }
  renderVals() {
    const all = [
      { repo: 'myapp/api', tag: 'latest', id: 'sha256:4be1c0', created: '12 min ago', size: '412 MB', used: ['api-server'] },
      { repo: 'myapp/worker', tag: 'latest', id: 'sha256:91d07e', created: '2 hours ago', size: '398 MB', used: ['worker-jobs'] },
      { repo: 'postgres', tag: '16-alpine', id: 'sha256:a7c3f2', created: '3 weeks ago', size: '274 MB', used: ['postgres-dev'] },
      { repo: 'nginx', tag: '1.27', id: 'sha256:2f8e61', created: '1 month ago', size: '192 MB', used: ['nginx-proxy'] },
      { repo: 'redis', tag: '7', id: 'sha256:c41a90', created: '1 month ago', size: '117 MB', used: ['redis-cache'] },
      { repo: 'axllent/mailpit', tag: 'latest', id: 'sha256:6d2b18', created: '2 months ago', size: '31 MB', used: ['mailpit'] },
      { repo: 'node', tag: '22-alpine', id: 'sha256:e05f3c', created: '2 months ago', size: '1.1 GB', used: [] },
      { repo: '<none>', tag: '<none>', id: 'sha256:08ab77', created: '5 days ago', size: '386 MB', used: [], dangling: true }
    ];
    const f = this.state.filter;
    const pick = (r) => f === 'all' || (f === 'used' ? r.used.length > 0 : f === 'unused' ? r.used.length === 0 && !r.dangling : !!r.dangling);
    const rows = all.filter(pick).map((r) => {
      const inUse = r.used.length > 0;
      return {
        ...r,
        inUse,
        removeOpacity: inUse ? '0.35' : '1',
        repoColor: r.dangling ? '#6E6E73' : '#1D1D1F',
        usedBy: inUse ? r.used.join(', ') : r.dangling ? 'Dangling' : 'Unused',
        usedColor: inUse ? '#1E7F3C' : r.dangling ? '#B54708' : '#6E6E73',
        dot: inUse ? '#28C840' : r.dangling ? '#E8590C' : '#AEAEB2'
      };
    });
    const count = (id) => all.filter((r) => id === 'all' || (id === 'used' ? r.used.length > 0 : id === 'unused' ? r.used.length === 0 && !r.dangling : !!r.dangling)).length;
    const segments = [['all', 'All'], ['used', 'In use'], ['unused', 'Unused'], ['dangling', 'Dangling']].map(([id, label]) => ({
      label: label + ' (' + count(id) + ')',
      active: f === id ? 'true' : 'false',
      cls: f === id ? 'seg on' : 'seg',
      pick: () => this.setState({ filter: id })
    }));
    return { rows, segments, pullOpen: this.state.pullOpen, togglePull: () => this.setState({ pullOpen: !this.state.pullOpen }) };
  }
}
</script>
</body>
</html>
