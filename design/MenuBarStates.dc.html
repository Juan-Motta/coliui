<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ColiUI — Menu bar states and notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1D1D1F}
a{color:#0066CC}a:hover{color:#004C99}
.nb{height:28px;padding:0 14px;border:0;border-radius:14px;background:rgba(0,0,0,0.06);font-size:12px;font-weight:500;font-family:inherit;color:#1D1D1F;cursor:pointer}
.nb:hover{background:rgba(0,0,0,0.1)}
</style>
</helmet>
<div style="width: 960px; height: 700px; box-sizing: border-box; padding: 40px; background: linear-gradient(135deg, #BFD3EE 0%, #E6D7EC 50%, #CFE6DA 100%); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">

<section aria-labelledby="icon-h" style="display: flex; flex-direction: column; gap: 14px">
<h2 id="icon-h" style="margin: 0; font-size: 15px; font-weight: 600">Menu bar icon states</h2>
<sc-for list="{{states}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 8px; font-size: 13px; color: #1D1D1F">
<span aria-hidden="true" style="opacity: 0.5">Wi‑Fi</span>
<span style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 22px; border-radius: 5px; background: {{s.hl}}">
<svg role="img" aria-label="{{s.aria}}" width="18" height="18" viewBox="0 0 100 100" fill="none" style="color: #1D1D1F; opacity: {{s.op}}"><rect x="8" y="8" width="84" height="84" rx="18" stroke="currentColor" stroke-width="9"></rect><g transform="translate(12 12) scale(0.78)"><path d="M30 95 L32 44 C32 36 34 32 37 30 L35 16 L41 27 L44 14 L47 28 C52 29 60 32 66 36 C69 38 69 44 66 46 C62 48 57 49 53 50 C51 54 50 60 50 70 L52 95 Z" fill="currentColor"></path></g></svg>
<sc-if value="{{s.badge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 1px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: {{s.badgeColor}}; border: 1.5px solid #FFFFFF"></span></sc-if>
</span>
<span aria-hidden="true" style="opacity: 0.5">10:48</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px">
<span style="font-weight: 600">{{s.label}}</span>
<span style="color: #6E6E73">{{s.desc}}</span>
</div>
</div>
</sc-for>
<p style="margin: 0; font-size: 12px; color: #3A3A3C; line-height: 1.5">Template image (monochrome) so it adapts to light and dark menu bars; only the badge uses color.</p>
</section>

<section aria-labelledby="notif-h" style="display: flex; flex-direction: column; gap: 14px">
<h2 id="notif-h" style="margin: 0; font-size: 15px; font-weight: 600">Notifications</h2>
<sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.6); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255,255,255,0.8); border-radius: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 10px 30px rgba(0,0,0,0.14)">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 100 100" style="flex: none">
<rect width="100" height="100" rx="22.5" fill="#1C1C1E"></rect>
<rect x="20" y="20" width="60" height="60" rx="12.9" fill="none" stroke="#F5F5F7" stroke-width="7"></rect>
<g transform="translate(22.9 22.9) scale(0.557)"><path d="M30 95 L32 44 C32 36 34 32 37 30 L35 16 L41 27 L44 14 L47 28 C52 29 60 32 66 36 C69 38 69 44 66 46 C62 48 57 49 53 50 C51 54 50 60 50 70 L52 95 Z" fill="#F5F5F7"></path></g>
</svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 600">{{n.title}}</span><span style="color: #6E6E73">{{n.time}}</span></div>
<span style="font-size: 12px; color: #3A3A3C; line-height: 1.4">{{n.body}}</span>
<div style="display: flex; gap: 6px; margin-top: 6px">
<button class="nb">{{n.a1}}</button>
<button class="nb">{{n.a2}}</button>
</div>
</div>
</div>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const states = [
      { label: 'VM stopped', desc: 'Dimmed glyph (35%)', op: 0.35, hl: 'transparent', badge: false, aria: 'ColiUI, Colima stopped' },
      { label: 'Starting / stopping', desc: 'Pulses 35% ↔ 100%', op: 0.65, hl: 'transparent', badge: false, aria: 'ColiUI, Colima starting' },
      { label: 'Running', desc: 'Full glyph', op: 1, hl: 'transparent', badge: false, aria: 'ColiUI, Colima running' },
      { label: 'Container failed', desc: 'Full glyph + orange badge', op: 1, hl: 'rgba(0,0,0,0.08)', badge: true, badgeColor: '#E8590C', aria: 'ColiUI, a container failed' }
    ];
    const notifs = [
      { title: 'worker-jobs exited (1)', time: 'now', body: 'shop-backend · stopped after 4 restarts in 3 min.', a1: 'View logs', a2: 'Restart' },
      { title: 'Colima disk 84% full', time: '2 min ago', body: '50.4 of 60 GiB used. About 11 GB can be freed.', a1: 'Open Cleanup', a2: 'Later' },
      { title: 'Colima stopped', time: '1 h ago', body: 'Profile “default” shut down unexpectedly.', a1: 'Start', a2: 'Show details' }
    ];
    return { states, notifs };
  }
}
</script>
</body>
</html>
