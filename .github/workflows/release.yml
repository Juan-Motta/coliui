# Each pushed version tag (v1.2.3) builds a signed, notarized DMG and publishes it as a GitHub Release,
# with the signed appcast.xml the app's updater reads.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes read the commits since the previous tag

      - name: Check project conventions
        run: scripts/check-conventions.sh

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Check the update keys
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Without the public key the app can't verify updates, so never ship a release without it.
          [ -s Resources/sparkle-public-key ] || { echo "Resources/sparkle-public-key is missing" >&2; exit 1; }
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "The SPARKLE_PRIVATE_KEY secret is missing" >&2; exit 1; }

      - name: Test
        # Serial, with a short limit: on the 3-core runners one parallel run hung for 30 minutes.
        timeout-minutes: 10
        run: swift test --no-parallel

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity in the certificate" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          # The secret holds the .p8 file's text as is, like Loqui's.
          (umask 077; printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH")
          scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Sign the appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          (umask 077; printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE")
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          DMG="ColiUI-${GITHUB_REF_NAME#v}.dmg"
          scripts/make-appcast.sh "build/$DMG" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$DMG" "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app reads releases/latest/download/appcast.xml, so each release carries its own appcast.
          gh release create "$GITHUB_REF_NAME" "build/ColiUI-${GITHUB_REF_NAME#v}.dmg" build/appcast.xml \
            --title "ColiUI ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Remove the signing keychain and the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
